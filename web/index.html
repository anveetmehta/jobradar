<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobradar</title>
<style>
  :root {
    --bg:#f7f7f5; --panel:#ffffff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e4e4e0;
    --accent:#2563eb; --accent-ink:#fff; --good:#16803c; --ok:#a16207; --weak:#b91c1c; --chip:#eef0ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15161a; --panel:#1e1f24; --ink:#eaeaea; --muted:#9a9a9a; --line:#2c2d33;
            --accent:#7aa2ff; --accent-ink:#0c1220; --good:#4ade80; --ok:#facc15; --weak:#f87171; --chip:#26283a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); overflow-x: hidden;
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
           display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  #meta { color: var(--muted); font-size: 12.5px; min-width: 0; overflow-wrap: break-word; }
  header a.edit { margin-left: auto; font-size: 12.5px; color: var(--accent); text-decoration: none; }
  #topbar { position: sticky; top: 0; z-index: 5; background: var(--panel); }
  #legend { padding: 6px 24px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
  #legend b { color: var(--ink); }
  #hidden-count { padding: 4px 24px; font-size: 11.5px; color: var(--muted);
                  border-bottom: 1px solid var(--line); }
  #controls { padding: 12px 24px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
              border-bottom: 1px solid var(--line); background: var(--panel); }
  input, select { background: var(--bg); color: var(--ink); border: 1px solid var(--line);
                  border-radius: 6px; padding: 6px 9px; font-size: 13px; }
  #search { flex: 1; min-width: 180px; }
  main { max-width: 880px; margin: 0 auto; padding: 16px 24px 60px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 10px; }
  .row1 { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .job-info { min-width: 0; }
  h2.title { font-weight: 600; font-size: 14.5px; margin: 0; font-family: inherit; line-height: inherit;
             overflow-wrap: break-word; }
  .company { color: var(--muted); font-size: 13px; margin-top: 1px; overflow-wrap: break-word; }
  .score-wrap { text-align: right; min-width: 46px; }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
  .score-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .03em;
                 display: block; margin-top: 1px; }
  .score.strong, .score.good, .score-label.strong, .score-label.good { color: var(--good); }
  .score.possible, .score.ok, .score-label.possible, .score-label.ok { color: var(--ok); }
  .score.weak, .score.poor, .score.unscored,
  .score-label.weak, .score-label.poor, .score-label.unscored { color: var(--weak); }
  .badge { display:inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em;
           background: var(--chip); color: var(--accent); border-radius: 5px;
           padding: 2px 6px; margin-left: 6px; vertical-align: 1px; }
  .meta2 { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .why { margin-top: 8px; font-size: 13px; }
  .gaps { margin-top: 6px; font-size: 12.5px; color: var(--weak); }
  .gaps ul { margin: 3px 0 0; padding-left: 18px; }
  .err { color: var(--muted); font-style: italic; font-size: 12.5px; margin-top: 6px; }
  .actions { margin-top: 10px; display:flex; gap: 14px; align-items:center; flex-wrap: wrap; }
  a.apply { font-size: 12.5px; color: var(--accent); text-decoration: none; }
  a.apply:hover { text-decoration: underline; }
  button { font-family: inherit; }
  button.tailor { background: var(--accent); color: var(--accent-ink); border: none;
                  border-radius: 6px; font-size: 12.5px; font-weight: 600; padding: 6px 11px;
                  cursor: pointer; }
  button.tailor:disabled { opacity: .55; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--line); color: var(--ink);
                      border-radius: 6px; font-size: 12.5px; padding: 6px 11px; cursor: pointer; }
  input.hm-name { font-family: inherit; font-size: 12.5px; padding: 6px 9px; border: 1px solid var(--line);
                  border-radius: 6px; background: var(--panel); color: var(--ink); min-width: 0; }
  .tailor-result { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
                    font-size: 12.5px; }
  .tailor-result a { color: var(--accent); margin-right: 14px; }
  .tailor-warn { color: var(--ok); margin-top: 4px; }
  .tailor-flag { color: var(--weak); margin-top: 4px; }
  #empty, #conn-lost { color: var(--muted); padding: 40px 0; text-align:center; }
  #setup-needed, #scan-needed { max-width: 560px; margin: 60px auto; text-align:center;
                                 color: var(--muted); font-size: 14px; line-height: 1.6; }
  #setup-needed a, #scan-needed code { color: var(--accent); }
  #scan-needed code { background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
                       padding: 2px 6px; }

  @media (max-width: 640px) {
    header { padding: 14px 14px; }
    header a.edit { margin-left: 0; }
    #legend, #hidden-count { padding: 6px 14px; }
    #controls { padding: 10px 14px; flex-direction: column; align-items: stretch; }
    #search, #controls select { width: 100%; min-width: 0; }
    main { padding: 12px 14px 40px; }
    .row1 { flex-wrap: wrap; }
    .score-wrap { text-align: left; margin-top: 4px; }
    .actions { flex-direction: column; align-items: stretch; }
    .actions button, .actions a, .actions input.hm-name { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
<header>
  <h1>jobradar</h1>
  <span id="meta">loading…</span>
  <a class="edit" href="setup.html">edit setup</a>
</header>
<div id="topbar">
  <div id="legend"><b>Score</b>: 0–100 fit, AI-judged — read the line under each card for why. <b>~</b> before the number = never AI-reviewed (quick preview, or the AI call failed) — a rough keyword guess only.</div>
  <div id="hidden-count" style="display:none"></div>
  <div id="controls">
    <input id="search" type="text" placeholder="Filter by title or company…">
    <select id="minScore">
      <option value="0">Any score</option>
      <option value="50">50+</option>
      <option value="65">65+</option>
      <option value="80">80+</option>
    </select>
    <select id="targetOnly">
      <option value="0">All companies</option>
      <option value="1">Target companies only</option>
    </select>
  </div>
</div>
<main>
  <div id="list"></div>
  <div id="empty" style="display:none">
    No results match these filters.<br><br>
    <button class="secondary" id="clear-filters">Clear filters</button>
  </div>
</main>
<script>
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let profileName = '';

async function boot() {
  let cfg;
  try {
    cfg = await (await fetch('/api/config')).json();
  } catch (e) {
    showConnLost();
    return;
  }
  if (!cfg.configured) {
    window.location.href = 'setup.html';
    return;
  }
  document.getElementById('meta').textContent = cfg.summary.headline || '';
  profileName = (cfg.profile && cfg.profile.name) || '';
  const justSetUp = new URLSearchParams(window.location.search).get('justSetUp') === '1';
  load(justSetUp);
}

function showConnLost() {
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('list').innerHTML = `<div id="conn-lost">
    Could not reach the jobradar server — is <code>jobradar.py serve</code> (or
    <code>install.sh</code>) still running in the terminal you started it from?<br><br>
    <button class="secondary" id="retry-btn">Retry</button>
  </div>`;
  document.getElementById('retry-btn').onclick = () => window.location.reload();
}

async function load(auto) {
  let data;
  try {
    const res = await fetch('../data/results.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('no results yet');
    data = await res.json();
  } catch (e) {
    document.getElementById('topbar').style.display = 'none';
    document.getElementById('list').innerHTML = `<div id="scan-needed">
      You're set up, but there's nothing to show yet.<br><br>
      <button class="tailor" id="scan-fast">Quick preview scan (instant, keyword-only)</button>
      &nbsp; <button class="tailor" id="scan-full">Full scan (a few minutes)</button>
      <div id="scan-status" style="margin-top:14px;color:var(--muted)"></div>
    </div>`;
    document.getElementById('scan-fast').onclick = () => runScan(true);
    document.getElementById('scan-full').onclick = () => runScan(false);
    if (auto) runScan(true);
    return;
  }
  render(data);
}

async function runScan(fast) {
  const status = document.getElementById('scan-status');
  document.getElementById('scan-fast').disabled = true;
  document.getElementById('scan-full').disabled = true;
  try {
    const res = await fetch('/api/scan', { method: 'POST', headers: {'Content-Type':'application/json'},
                                           body: JSON.stringify({ fast }) });
    if (res.status === 409) { status.textContent = 'A scan is already running...'; }
  } catch (e) {
    status.textContent = 'Could not reach the server: ' + e.message;
    return;
  }
  poll();
}

async function poll() {
  const status = document.getElementById('scan-status');
  try {
    const s = await (await fetch('/api/scan/status')).json();
    if (s.status === 'running') {
      status.textContent = s.message || 'working...';
      setTimeout(poll, 1500);
    } else if (s.status === 'error') {
      status.innerHTML = `Scan failed: ${esc(s.error)} ` +
        `<button class="secondary" id="verify-link">Check your company boards →</button>`;
      document.getElementById('scan-fast').disabled = false;
      document.getElementById('scan-full').disabled = false;
      document.getElementById('verify-link').addEventListener('click', () => runVerify(status));
    } else if (s.status === 'done') {
      status.textContent = `Done — ${s.count} roles. Loading...`;
      setTimeout(() => load(false), 400);
    }
  } catch (e) {
    status.textContent = 'Lost contact with the server — is it still running?';
  }
}

async function runVerify(container) {
  const box = document.createElement('div');
  box.style.cssText = 'margin-top:10px;font-size:12.5px;line-height:1.7';
  box.textContent = 'Checking your company boards…';
  container.appendChild(box);
  try {
    const data = await (await fetch('/api/verify')).json();
    const boards = data.boards || [];
    box.innerHTML = boards.length ? boards.map(b => {
      const broken = b.status !== '200';
      const tag = broken ? `broken (status ${esc(b.status)})` : (b.count === 0 ? 'no open roles right now' : `${b.count} postings`);
      return `<div>${broken ? '⚠' : '✓'} <b>${esc(b.name)}</b> <span style="color:var(--muted)">(${esc(b.ats)})</span> — ${tag}</div>`;
    }).join('') : 'No companies configured yet — add some in setup.';
  } catch (e) {
    box.textContent = 'Could not check company boards: ' + e.message;
  }
}

function verdictClass(j) {
  if (j.ai_score == null) return 'unscored';
  if (j.ai_verdict) return j.ai_verdict;
  if (j.rank_score >= 80) return 'strong';
  if (j.rank_score >= 55) return 'possible';
  return 'weak';
}

async function tailor(job, btn, resultEl) {
  btn.disabled = true;
  btn.textContent = 'Starting…';
  resultEl.innerHTML = '';
  try {
    const res = await fetch('/api/tailor', { method: 'POST', headers: {'Content-Type':'application/json'},
                                             body: JSON.stringify({ job }) });
    if (res.status === 409) {
      resultEl.innerHTML = `<div class="tailor-result tailor-flag">Another tailor request is already running — wait for it to finish.</div>`;
      btn.disabled = false;
      btn.textContent = 'Tailor resume & cover letter';
      return;
    }
  } catch (e) {
    resultEl.innerHTML = `<div class="tailor-result tailor-flag">Could not reach the server: ${esc(e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Tailor resume & cover letter';
    return;
  }
  pollTailor(btn, resultEl);
}

async function pollTailor(btn, resultEl) {
  let data;
  try {
    data = await (await fetch('/api/tailor/status')).json();
  } catch (e) {
    resultEl.innerHTML = `<div class="tailor-result tailor-flag">Lost contact with the server.</div>`;
    btn.disabled = false;
    btn.textContent = 'Tailor resume & cover letter';
    return;
  }
  if (data.status === 'running') {
    btn.textContent = data.message || 'Working…';
    setTimeout(() => pollTailor(btn, resultEl), 1200);
    return;
  }
  btn.disabled = false;
  btn.textContent = 'Tailor resume & cover letter';
  if (data.status === 'error') {
    resultEl.innerHTML = `<div class="tailor-result tailor-flag">Could not generate: ${esc(data.error)}. Check your AI backend (Ollama running? API key set?) in setup.</div>`;
    return;
  }
  const r = data.result;
  if (!r) return; // still idle — nothing to render
  let html = `<div class="tailor-result">`;
  const company = r.company_name || '';
  const title = r.job_title || '';
  const nameFor = (kind) => [profileName, company, title, kind].filter(Boolean).join(' - ');
  html += `<a href="${esc(r.resume_url)}" target="_blank">Resume (${r.resume_pages || '?'} page)</a>`;
  html += ` <a href="${esc(r.resume_url)}" download="${esc(nameFor('Resume'))}.html">Download as…</a>`;
  if (r.cover_letter_url) {
    html += `<a href="${esc(r.cover_letter_url)}" target="_blank">Cover letter (${r.cover_letter_pages || '?'} page)</a>`;
    html += ` <a href="${esc(r.cover_letter_url)}" download="${esc(nameFor('Cover Letter'))}.html">Download as…</a>`;
  }
  for (const w of [...(r.resume_warnings||[]), ...(r.cover_letter_warnings||[])]) {
    html += `<div class="tailor-warn">${esc(w)}</div>`;
  }
  if (r.removed_skills && r.removed_skills.length) {
    html += `<div class="tailor-flag">Removed skill(s) the model invented, not in your profile: ${esc(r.removed_skills.join(', '))}</div>`;
  }
  for (const c of (r.claim_flags||[])) {
    html += `<div class="tailor-flag">Check before sending — possibly unverified claim: "${esc(c)}"</div>`;
  }
  if (r.unmet_requirements && r.unmet_requirements.length) {
    html += `<div class="tailor-flag">This posting asks for things your profile doesn't support: ${esc(r.unmet_requirements.join('; '))}</div>`;
  }
  html += `</div>`;
  resultEl.innerHTML = html;
}

function render(data) {
  const jobs = data.jobs || [];
  document.getElementById('meta').textContent =
    `${jobs.length} roles · ${data.profile_headline || ''} · scored with ${data.ai_backend || 'n/a'} · generated ${data.generated_at || ''}`;

  if (data.dropped_below_min_score) {
    const hc = document.getElementById('hidden-count');
    hc.style.display = '';
    hc.textContent = `${data.dropped_below_min_score} job(s) scored below your cutoff (${data.min_score}) and aren't shown — lower it in setup to see them.`;
  }

  const search = document.getElementById('search');
  const minScore = document.getElementById('minScore');
  const targetOnly = document.getElementById('targetOnly');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');

  function draw() {
    const q = search.value.trim().toLowerCase();
    const min = parseInt(minScore.value, 10);
    const onlyTarget = targetOnly.value === '1';
    const shown = jobs.filter(j => {
      if (onlyTarget && !j.is_target) return false;
      if ((j.ai_score ?? j.rank_score ?? 0) < min) return false;
      if (q && !(`${j.title} ${j.company}`.toLowerCase().includes(q))) return false;
      return true;
    });
    list.innerHTML = '';
    empty.style.display = shown.length ? 'none' : 'block';
    for (const j of shown) {
      const el = document.createElement('div');
      el.className = 'card';
      const scoreVal = j.ai_score ?? j.rank_score;
      const scoreLabel = j.ai_score != null ? scoreVal : `~${Math.round(scoreVal)}`;
      const vClass = verdictClass(j);
      const gaps = (j.ai_gaps || []).map(g => `<li>${esc(g)}</li>`).join('');
      el.innerHTML = `
        <div class="row1">
          <div class="job-info">
            <h2 class="title">${esc(j.title)}${j.is_target ? '<span class="badge">TARGET</span>' : ''}</h2>
            <div class="company">${esc(j.company)}</div>
          </div>
          <div class="score-wrap">
            <div class="score ${vClass}">${scoreLabel}</div>
            <div class="score-label ${vClass}">${esc(vClass)}</div>
          </div>
        </div>
        <div class="meta2">${esc(j.location || '—')} · via ${esc(j.source || '')}${j.posted ? ' · seen ' + esc(j.posted) : ''}</div>
        ${j.ai_why ? `<div class="why">${esc(j.ai_why)}</div>` : (j.ai_score == null ? '<div class="why">Not AI-reviewed yet — this is a rough keyword-based guess.</div>' : '')}
        ${gaps ? `<div class="gaps">Gaps: <ul>${gaps}</ul></div>` : ''}
        ${j.ai_error ? `<div class="err">AI scoring unavailable (${esc(j.ai_error)}) — ranked by keyword prescreen only.</div>` : ''}
        <div class="actions">
          ${j.url ? `<a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Open posting →</a>` : ''}
          <input class="hm-name" type="text" placeholder="Hiring manager's name (optional)">
          <button class="tailor">Tailor resume &amp; cover letter</button>
        </div>
        <div class="tailor-slot"></div>
      `;
      el.querySelector('.tailor').addEventListener('click', (ev) => {
        const hm = el.querySelector('.hm-name').value.trim();
        const jobWithHm = hm ? { ...j, hiring_manager_name: hm } : j;
        tailor(jobWithHm, ev.target, el.querySelector('.tailor-slot'));
      });
      list.appendChild(el);
    }
  }

  document.getElementById('clear-filters').addEventListener('click', () => {
    search.value = ''; minScore.value = '0'; targetOnly.value = '0'; draw();
  });
  search.addEventListener('input', draw);
  minScore.addEventListener('change', draw);
  targetOnly.addEventListener('change', draw);
  draw();
}
boot();
</script>
</body>
</html>
