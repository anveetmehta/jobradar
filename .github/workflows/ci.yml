name: ci
on: [push, pull_request]
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: compile check
        run: python -m py_compile jobradar.py match.py resume.py render.py fit.py pdf.py notify.py webapp.py sources/*.py
      - name: example config/profile are valid JSON
        run: |
          python -c "import json; json.load(open('examples/config.example.json'))"
          python -c "import json; json.load(open('examples/profile.example.json'))"
      - name: web/setup.html and web/index.html inline JS has no syntax errors
        run: |
          python -c "
          import re
          for f in ('web/setup.html', 'web/index.html'):
              html = open(f).read()
              m = re.search(r'<script>(.*)</script>', html, re.S)
              open(f.replace('/', '_') + '.js', 'w').write(m.group(1))
          "
          node --check web_setup.html.js
          node --check web_index.html.js
      - name: web UI reports unconfigured before init
        run: |
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          out=$(curl -sf http://localhost:8765/api/config)
          echo "$out"
          echo "$out" | grep -q '"configured": false' \
            || (echo "expected configured:false on a clean checkout"; kill $(cat /tmp/serve.pid); exit 1)
          kill $(cat /tmp/serve.pid)
      - name: init works from a clean checkout
        run: |
          python jobradar.py init
          test -f config.json && test -f profile.json
      - name: init strips example-file _..._note/_readme keys, doesn't leave permanent clutter
        run: |
          python -c "
          import json
          for f in ('config.json', 'profile.json'):
              d = json.load(open(f))
              bad = [k for k in d if k.startswith('_')]
              assert not bad, f'{f} still has note keys: {bad}'
          print('no note-key clutter in either file')
          "
      - name: web UI reports configured after init, serves the setup + main pages, includes full payload for pre-fill
        run: |
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          out=$(curl -sf http://localhost:8765/api/config)
          echo "$out" | grep -q '"configured": true'
          echo "$out" | grep -q '"config":' # Phase 2a: full payload for setup.html to pre-fill from
          echo "$out" | grep -q '"profile":'
          echo "$out" | grep -q '"ats_companies":' # Phase 0: renamed from watched_companies
          curl -sf -o /dev/null http://localhost:8765/web/setup.html
          curl -sf -o /dev/null http://localhost:8765/web/index.html
          kill $(cat /tmp/serve.pid)
      - name: /api/test-ai reports unreachable cleanly (no Ollama on the CI runner)
        run: |
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          out=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"backend":"ollama","model":"nonexistent-model-xyz"}' \
            http://localhost:8765/api/test-ai)
          echo "$out"
          echo "$out" | grep -q '"reachable": false'
          out2=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"backend":"anthropic","model":"claude-sonnet-5"}' http://localhost:8765/api/test-ai)
          echo "$out2"
          echo "$out2" | grep -q '"reason": "missing_key"'
          kill $(cat /tmp/serve.pid)
      - name: /api/parse-resume extracts real text and reports an unreachable AI backend cleanly
        run: |
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          python -c "
          import base64, json
          b64 = base64.b64encode(b'Jordan Rivera\njordan@example.com\nSenior PM.').decode()
          json.dump({'filename': 'r.txt', 'file_b64': b64, 'ai_backend': 'ollama', 'ai_model': 'x'},
                    open('/tmp/parse_req.json', 'w'))
          "
          out=$(curl -sf -X POST -H 'Content-Type: application/json' -d @/tmp/parse_req.json \
            http://localhost:8765/api/parse-resume)
          echo "$out"
          echo "$out" | grep -q '"ok": false'
          echo "$out" | grep -qi "ollama isn't reachable"
          out2=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"filename":"r.exe","file_b64":"aGVsbG8=","ai_backend":"ollama","ai_model":"x"}' \
            http://localhost:8765/api/parse-resume)
          echo "$out2"
          echo "$out2" | grep -qi "unsupported file type"
          kill $(cat /tmp/serve.pid)
      - name: /api/pull-model reports "not installed" cleanly (no ollama binary on the CI runner)
        run: |
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"model":"mistral-nemo"}' \
            http://localhost:8765/api/pull-model > /dev/null
          for i in $(seq 1 10); do
            out=$(curl -sf http://localhost:8765/api/pull-model/status)
            echo "$out"
            echo "$out" | grep -q '"status": "error"' && break
            sleep 1
          done
          echo "$out" | grep -q "not_installed"
          kill $(cat /tmp/serve.pid)
      - name: /api/resolve-companies merges a hand-resolved slug into ats_companies
        run: |
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"companies":[{"name":"CI Test Co","slug":"citestco","ats":"greenhouse"}]}' \
            http://localhost:8765/api/resolve-companies | grep -q '"CI Test Co"'
          grep -q '"CI Test Co"' config.json
          kill $(cat /tmp/serve.pid)
      - name: verify reaches the configured ATS boards
        run: python jobradar.py verify
      - name: /api/verify is the web equivalent, one entry per configured board
        run: |
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          curl -sf http://localhost:8765/api/verify -o /tmp/verify_out.json
          head -c 500 /tmp/verify_out.json
          python -c "
          import json
          d = json.load(open('/tmp/verify_out.json'))
          boards = d['boards']
          assert boards, 'expected at least one board'
          for b in boards:
              assert set(b.keys()) >= {'name', 'ats', 'status', 'count'}, b
          print(f'{len(boards)} board(s) checked')
          "
          kill $(cat /tmp/serve.pid)
      - name: fast scan runs end-to-end without an AI backend
        run: python jobradar.py scan --fast
      - name: a browser-triggered scan (/api/scan) reaches done, not just the CLI one
        run: |
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"fast": true}' \
            http://localhost:8765/api/scan
          for i in $(seq 1 30); do
            out=$(curl -sf http://localhost:8765/api/scan/status)
            echo "$out"
            echo "$out" | grep -q '"status": "done"' && break
            echo "$out" | grep -q '"status": "error"' \
              && (echo "scan errored"; kill $(cat /tmp/serve.pid); exit 1)
            sleep 2
          done
          echo "$out" | grep -q '"status": "done"' \
            || (echo "scan did not finish in time"; kill $(cat /tmp/serve.pid); exit 1)
          kill $(cat /tmp/serve.pid)
          python -c "import json; d=json.load(open('data/results.json')); assert 'dropped_below_min_score' in d and 'min_score' in d"
      - name: tailor fails cleanly (no controlled error, no traceback) with no AI backend up
        run: |
          set +e
          out=$(python jobradar.py tailor 1 2>&1)
          code=$?
          echo "$out"
          test $code -ne 0 || (echo "expected a non-zero exit with no AI backend reachable"; exit 1)
          echo "$out" | grep -qi "Could not generate resume content" \
            || (echo "expected the controlled error message, got a traceback or something else"; exit 1)
      - name: tailor produces sidecar report + hiring-manager salutation (mocked AI, exercises the real happy path since CI has no live backend)
        run: |
          python -c "
          import json
          from pathlib import Path
          import resume, jobradar as jr

          def fake_build_resume(profile_text, job_rec, desc, ai_cfg, api_key):
              return {'headline': 'h', 'summary': 's', 'skills_line': ['A', 'InventedSkillXYZ'],
                      'experience': [{'company': 'Acme', 'title': 'PM', 'dates': '2020-2024',
                                      'bullets': ['did a thing']}],
                      'unmet_requirements': ['req A']}

          def fake_build_cover_letter(profile_text, job_rec, desc, ai_cfg, api_key):
              return {'opening': 'o', 'body': ['b'], 'closing': 'c', 'acknowledge_gap': ''}

          resume.build_resume = fake_build_resume
          resume.build_cover_letter = fake_build_cover_letter
          resume.validate_resume = lambda content, profile: ['InventedSkillXYZ']
          resume.scan_for_unverified_claims = lambda text, profile: []

          profile = json.load(open('profile.json'))
          cfg = json.load(open('config.json'))
          profile_text = jr.profile_to_text(profile)
          job_rec = {'url': 'https://example.com/j/1', 'company': 'TestCo', 'title': 'Sr PM',
                     'hiring_manager_name': 'Jane Doe'}

          report = jr.tailor_job(job_rec, profile, profile_text, cfg, Path('.'))
          resume_html = Path(report['resume_report']['html_path']).read_text()
          letter_html = Path(report['letter_report']['html_path']).read_text()

          assert 'jobradar-note' in resume_html, 'notes block missing from resume HTML'
          assert 'req A' in resume_html, 'unmet requirement note missing'
          assert 'Dear Jane Doe,' in letter_html, 'hiring_manager_name salutation missing'

          sidecars = list(Path('output').rglob('resume_report.json'))
          assert sidecars, 'no sidecar resume_report.json written'
          assert 'testco' in str(sidecars[0]).lower() and 'sr-pm' in str(sidecars[0]).lower(), \
              f'expected a company/role subfolder, got {sidecars[0]}'
          sidecar = json.load(open(sidecars[0]))
          assert sidecar['removed_skills'] == ['InventedSkillXYZ']
          print('phase 5 checks passed')
          "
      - name: paths.output_dir can point outside the app dir, served via /files/ with traversal blocked
        run: |
          cp config.json /tmp/config_backup.json
          python -c "
          import json
          cfg = json.load(open('config.json'))
          cfg.setdefault('paths', {})['output_dir'] = '/tmp/jobradar_custom_output'
          json.dump(cfg, open('config.json', 'w'))
          "
          python -c "
          import resume, jobradar as jr, json
          resume.build_resume = lambda *a: {'headline': 'h', 'summary': 's', 'skills_line': [],
              'experience': [{'company': 'Acme', 'title': 'PM', 'dates': '2024', 'bullets': ['x']}]}
          resume.build_cover_letter = lambda *a: {'opening': 'o', 'body': ['b'], 'closing': 'c', 'acknowledge_gap': ''}
          resume.validate_resume = lambda content, profile: []
          resume.scan_for_unverified_claims = lambda text, profile: []
          profile = json.load(open('profile.json'))
          cfg = json.load(open('config.json'))
          job_rec = {'url': 'https://example.com/j/2', 'company': 'OutDirCo', 'title': 'Role X'}
          report = jr.tailor_job(job_rec, profile, jr.profile_to_text(profile), cfg, __import__('pathlib').Path('.'))
          assert str(report['resume_report']['html_path']).startswith('/tmp/jobradar_custom_output'), report
          "
          test -f /tmp/jobradar_custom_output/outdirco/role-x/resume.html
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          curl -sf http://localhost:8765/files/outdirco/role-x/resume.html -o /tmp/served_resume.html
          grep -q "Acme" /tmp/served_resume.html
          # --path-as-is: curl normally collapses ../ client-side per RFC 3986 before
          # sending the request at all, which would test curl's normalization, not
          # ours — this flag sends the literal path so the traversal actually reaches
          # _serve_output_file's own containment check.
          code=$(curl -s --path-as-is -o /dev/null -w '%{http_code}' "http://localhost:8765/files/../../../../etc/passwd")
          test "$code" = "403" || (echo "expected 403 on a traversal attempt, got $code"; kill $(cat /tmp/serve.pid); exit 1)
          kill $(cat /tmp/serve.pid)
          mv /tmp/config_backup.json config.json
          rm -rf /tmp/jobradar_custom_output
      - name: watch --once completes without crashing (no AI backend, real target-company boards)
        run: python jobradar.py watch --once
      - name: /api/tailor (now async, Phase 4c) reaches status error cleanly, not a server crash, with no AI backend up
        run: |
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          job=$(python -c "import json; print(json.dumps({'job': json.load(open('data/results.json'))['jobs'][0]}))")
          out=$(curl -sf -X POST -H 'Content-Type: application/json' -d "$job" http://localhost:8765/api/tailor)
          echo "$out"
          echo "$out" | grep -q '"status": "running"' \
            || (echo "expected an immediate 202 running state, got something else"; kill $(cat /tmp/serve.pid); exit 1)
          for i in $(seq 1 30); do
            out=$(curl -sf http://localhost:8765/api/tailor/status)
            echo "$out"
            echo "$out" | grep -q '"status": "error"' && break
            sleep 2
          done
          echo "$out" | grep -q '"status": "error"' \
            || (echo "tailor never reached an error state"; kill $(cat /tmp/serve.pid); exit 1)
          echo "$out" | grep -qi '"error":' \
            || (echo "expected a non-null error field"; kill $(cat /tmp/serve.pid); exit 1)
          curl -sf -o /dev/null http://localhost:8765/api/config  # server still alive, didn't crash
          kill $(cat /tmp/serve.pid)
      - name: invalid JSON in config.json fails with a plain-language message, not a raw traceback
        run: |
          echo '{"broken": true,,}' > /tmp/bad_config.json
          set +e
          out=$(python jobradar.py --config /tmp/bad_config.json scan --fast 2>&1)
          code=$?
          echo "$out"
          set -e
          test $code -ne 0
          echo "$out" | grep -qi "invalid JSON at line"
          if echo "$out" | grep -qi "Traceback"; then
            echo "raw traceback leaked to the user"; exit 1
          fi
      - name: a corrupted config.json doesn't leave a background scan stuck on "running" forever
        run: |
          cp config.json /tmp/config_backup.json
          echo '{"broken": true,,}' > config.json
          python jobradar.py serve --port 8765 & echo $! > /tmp/serve.pid
          sleep 2
          curl -s -X POST -H 'Content-Type: application/json' -d '{"fast": true}' \
            http://localhost:8765/api/scan > /dev/null
          for i in $(seq 1 15); do
            out=$(curl -s http://localhost:8765/api/scan/status)
            echo "$out"
            echo "$out" | grep -q '"status": "error"' && break
            sleep 1
          done
          echo "$out" | grep -q '"status": "error"' \
            || (echo "scan never reported an error — the old sys.exit-swallowed-by-thread bug is back"; \
                kill $(cat /tmp/serve.pid); exit 1)
          # confirm the server itself is still alive via a route that doesn't touch config.json
          # (broken config.json also breaks GET /api/config today — that's the separate do_GET
          # exception-handling gap Phase 2 fixes; not what this step is testing)
          curl -sf -o /dev/null http://localhost:8765/web/index.html
          kill $(cat /tmp/serve.pid)
          mv /tmp/config_backup.json config.json
      - name: install.sh works from scratch (its own fresh venv, not the one above)
        run: |
          cd /tmp && rm -rf install_test && cp -r "$GITHUB_WORKSPACE" install_test && cd install_test
          rm -rf .venv config.json profile.json data/results.json data/seen_urls.json .cache
          ./install.sh --port 8766 & echo $! > /tmp/install_test.pid
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8766/api/config && break
            sleep 2
          done
          curl -sf http://localhost:8766/api/config | grep -q '"configured": false'
          kill $(cat /tmp/install_test.pid)
